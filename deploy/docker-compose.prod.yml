# Produktions-Stack (MVP für Vincenz, 2026-08-05):
#   caddy (TLS + Basic-Auth + statisches Frontend) -> backend -> postgres
#   + nächtliche pg_dump-Backups mit 14 Tagen Aufbewahrung.
# Bedienung: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: brewery
      POSTGRES_USER: brewery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env anlegen — siehe deploy/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewery -d brewery"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ..
      target: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://brewery:${POSTGRES_PASSWORD}@db:5432/brewery
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: ..
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?deploy/.env anlegen — siehe deploy/.env.example}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Täglich um ~03:00 ein Dump, 14 Tage Aufbewahrung. Bewusst eine
    # simple Schleife statt Cron-Infrastruktur (wenigste bewegliche Teile).
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          now=$$(date +%s)
          next=$$(date -d "03:00 next day" +%s 2>/dev/null || date -d "tomorrow 03:00" +%s)
          sleep $$(( next - now ))
          pg_dump -h db -U brewery -d brewery -F c -f "/backups/brewery-$$(date +%F).dump" \
            && echo "Backup ok: brewery-$$(date +%F).dump"
          find /backups -name 'brewery-*.dump' -mtime +14 -delete
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
