[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brewery-scheduler-backend"
version = "0.1.0"
description = "Backend for the brewery scheduling and planning app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    # Pinned: an unpinned ruff let a new release change the default rule set
    # and turn CI red without any code change. Bump deliberately.
    "ruff==0.16.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit selection so ruff upgrades can't silently widen the rule set.
# E/F = pycodestyle+pyflakes baseline, I = import sorting. Deliberately
# excluded: B008 (FastAPI's `Depends` idiom), DTZ/UP pedantry.
select = ["E4", "E7", "E9", "F", "I"]
