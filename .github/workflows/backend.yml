name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewery
          POSTGRES_PASSWORD: brewery
          POSTGRES_DB: brewery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://brewery:brewery@localhost:5432/brewery_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run smoke tests
        run: pytest -ra

      # Die Tests laufen editierbar installiert und sehen den Quellbaum —
      # das Prod-Image installiert dagegen ein Wheel. Fehlten dort die
      # Seed-Daten, startete das Backend erst beim Kunden nicht mehr.
      - name: Seed-Daten liegen im Wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, os, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          im_wheel = set(zipfile.ZipFile(wheel).namelist())
          fehlend = [
              os.path.basename(p)
              for p in glob.glob("src/brewery_scheduler/data/*.json")
              if f"brewery_scheduler/data/{os.path.basename(p)}" not in im_wheel
          ]
          assert not fehlend, f"Im Wheel fehlen: {fehlend}"
          print("Datendateien im Wheel:", sorted(n for n in im_wheel if "/data/" in n))
          PY
